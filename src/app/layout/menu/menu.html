<nav aria-label="Menú principal">
  <mat-nav-list>
    <a
      mat-list-item
      routerLink="/"
      routerLinkActive="activo"
      [routerLinkActiveOptions]="{ exact: true }"
      (click)="navegar.emit()"
    >
      <mat-icon matListItemIcon>home</mat-icon>
      <span matListItemTitle>Inicio</span>
    </a>

    @if (estaLogueado()) {
      <a mat-list-item routerLink="/perfil" routerLinkActive="activo" (click)="navegar.emit()">
        <mat-icon matListItemIcon>account_circle</mat-icon>
        <span matListItemTitle>Mi perfil</span>
      </a>
    }

    <mat-divider />

    @for (opcion of opciones(); track opcion.ruta) {
      <a mat-list-item [routerLink]="opcion.ruta" routerLinkActive="activo" (click)="navegar.emit()">
        <mat-icon matListItemIcon>{{ opcion.icono }}</mat-icon>
        <span matListItemTitle>{{ opcion.etiqueta }}</span>
      </a>
    }
  </mat-nav-list>
</nav>
