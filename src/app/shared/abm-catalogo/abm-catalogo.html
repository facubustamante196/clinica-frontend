<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ config().titulo }}</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="barra">
      <mat-form-field class="filtro" subscriptSizing="dynamic">
        <mat-label>Buscar</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [value]="filtro()" (input)="alFiltrar($event)" />
      </mat-form-field>

      <button mat-flat-button type="button" (click)="abrirFormulario()">
        <mat-icon>add</mat-icon>
        {{ config().tituloAlta }}
      </button>
    </div>

    @if (cargando()) {
      <app-cargando />
    } @else if (errorCarga()) {
      <app-sin-resultados icono="cloud_off" mensaje="No se pudo cargar el listado." />
      <div class="reintentar">
        <button mat-button type="button" (click)="cargar()">Reintentar</button>
      </div>
    } @else if (filtrados().length === 0) {
      <app-sin-resultados
        [mensaje]="
          filtro() ? 'Ningún registro coincide con la búsqueda.' : 'Todavía no hay registros cargados.'
        "
      />
    } @else {
      <table mat-table [dataSource]="filtrados()">
        @for (campo of config().campos; track campo.nombre) {
          <ng-container [matColumnDef]="campo.nombre">
            <th mat-header-cell *matHeaderCellDef>{{ campo.etiqueta }}</th>
            <td mat-cell *matCellDef="let item">{{ item[campo.nombre] }}</td>
          </ng-container>
        }

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="columna-acciones">Acciones</th>
          <td mat-cell *matCellDef="let item" class="columna-acciones">
            <button
              mat-icon-button
              type="button"
              matTooltip="Editar"
              aria-label="Editar"
              (click)="abrirFormulario(item)"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              type="button"
              matTooltip="Eliminar"
              aria-label="Eliminar"
              (click)="eliminar(item)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnas()"></tr>
        <tr mat-row *matRowDef="let fila; columns: columnas()"></tr>
      </table>
    }
  </mat-card-content>
</mat-card>
