<mat-card class="pagina-estado" appearance="outlined">
  <mat-card-content>
    <mat-icon class="icono">{{ icono() }}</mat-icon>
    <h1>{{ titulo() }}</h1>
    <p>{{ mensaje() }}</p>
  </mat-card-content>
  <mat-card-actions align="end">
    <a mat-button routerLink="/">Volver al inicio</a>
  </mat-card-actions>
</mat-card>
