<mat-card appearance="outlined">
  <mat-card-header>
    <mat-card-title>Mi agenda</mat-card-title>
  </mat-card-header>

  <mat-card-content>
    <div class="barra">
      <mat-form-field appearance="outline" subscriptSizing="dynamic">
        <mat-label>Fecha</mat-label>
        <input matInput [matDatepicker]="selectorFecha" [formControl]="fecha" />
        <mat-datepicker-toggle matIconSuffix [for]="selectorFecha" />
        <mat-datepicker #selectorFecha />
      </mat-form-field>

      <span class="espaciador"></span>

      <button mat-flat-button type="button" (click)="nuevo()" [disabled]="errorCarga()">
        <mat-icon>add</mat-icon>
        Nuevo rango
      </button>
    </div>

    @if (cargando()) {
      <app-cargando mensaje="Cargando tu agenda…" />
    } @else if (errorCarga()) {
      <app-sin-resultados icono="cloud_off" mensaje="No se pudo cargar la agenda." />
      <div class="centrado">
        <button mat-button type="button" (click)="cargar()">Reintentar</button>
      </div>
    } @else if (ordenadas().length === 0) {
      <app-sin-resultados
        icono="event_busy"
        mensaje="No tenés rangos horarios cargados para esta fecha."
      />
    } @else {
      <div class="tabla-scroll">
      <table mat-table [dataSource]="ordenadas()">
        <ng-container matColumnDef="horario">
          <th mat-header-cell *matHeaderCellDef>Horario</th>
          <td mat-cell *matCellDef="let agenda">{{ agenda.hora_entrada | hora }} a {{ agenda.hora_salida | hora }}</td>
        </ng-container>

        <ng-container matColumnDef="especialidad">
          <th mat-header-cell *matHeaderCellDef>Especialidad</th>
          <td mat-cell *matCellDef="let agenda">{{ agenda.especialidad_descripcion }}</td>
        </ng-container>

        <ng-container matColumnDef="sede">
          <th mat-header-cell *matHeaderCellDef>Sede</th>
          <td mat-cell *matCellDef="let agenda">{{ agenda.sede_nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="columna-acciones">Acciones</th>
          <td mat-cell *matCellDef="let agenda" class="columna-acciones">
            <button
              mat-icon-button
              type="button"
              matTooltip="Modificar"
              aria-label="Modificar rango horario"
              (click)="editar(agenda)"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              type="button"
              matTooltip="Eliminar"
              aria-label="Eliminar rango horario"
              [disabled]="eliminando() === agenda.id"
              (click)="eliminar(agenda)"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnas"></tr>
        <tr mat-row *matRowDef="let fila; columns: columnas"></tr>
      </table>
      </div>
    }
  </mat-card-content>
</mat-card>
